spring.application.name=voting-api

# Conexion a MongoDB
# Por defecto usa Mongo local; en produccion/Atlas se sobreescribe con la
# variable de entorno MONGODB_URI (ver README para como configurarla).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/voting_db}

server.port=8080

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
